<h1>Daily Activity Tracker</h1>

<form method="POST" action="/activity">
    <input type="text" name="description" placeholder="Activity" required>
    <input type="date" name="date" required>
    <input type="number" name="duration" placeholder="Minutes">
    <button type="submit">Add</button>
</form>

<a href="/activities">View activities</a>
